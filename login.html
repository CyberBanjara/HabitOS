<html lang="en">

<head>

  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Login - HabitOS</title>
  <meta name="description" content="Log in to HabitOS with Google or email." />

  <link href="assets/img/favicon.png" rel="icon" />
  <link href="assets/img/apple-touch-icon.png" rel="apple-touch-icon" />
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Caveat:wght@600;700&display=swap"
    rel="stylesheet" />

  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet" />
  <link href="assets/css/main.css" rel="stylesheet" />
  <link href="assets/css/product-landing.css" rel="stylesheet" />

  <script src="assets/js/public-config.js"></script>
  <script src="assets/js/app-config.js"></script>
</head>

<body class="product-page checkout-page" data-page-id="auth-login">
  <div id="hbHeaderHost" data-include="partials/navbar.html"></div>

  <main class="main checkout-main">
    <section class="checkout-hero">
      <div class="container">
        <div class="checkout-layout">
          <div class="checkout-copy">
            <span class="scribble-label">welcome back</span>
            <h1>Log in your way.</h1>
            <p>Continue with Google or email/password to access your tracker and purchases.</p>
          </div>

          <div class="checkout-card-modern">
            <div class="checkout-card-top">
              <div>
                <small>HabitOS account</small>
                <h2>Login</h2>
              </div>
              <i class="bi bi-person-circle fs-2"></i>
            </div>

            <div class="auth-status alert" data-auth-status hidden></div>
            <div id="loginError" class="inline-alert error" hidden></div>
            <div id="loginSuccess" class="inline-alert success" hidden></div>

            <div class="auth-providers-group">
              <button type="button" class="google-auth-button" id="googleLoginBtn">
                <span class="google-g" aria-hidden="true">G</span>
                <span>Continue with <span class="google-word"><span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span></span></span>
              </button>

              <button type="button" class="facebook-auth-button" id="facebookLoginBtn">
                <i class="bi bi-facebook facebook-icon"></i>
                <span>Continue with <span class="facebook-word">Facebook</span></span>
              </button>

              <button type="button" class="anonymous-auth-button" id="anonymousLoginBtn">
                <i class="bi bi-incognito anonymous-icon"></i>
                <span>Continue as <span class="anonymous-word">Guest</span></span>
              </button>
            </div>

            <div class="auth-alt-strip">
              <span></span>
              <small>or email</small>
              <span></span>
            </div>

            <form data-auth-form="login" novalidate>
              <label for="loginEmail">Email</label>
              <input id="loginEmail" name="email" type="email" autocomplete="email" placeholder="you@example.com"
                required />
              <label class="mt-3" for="loginPassword">Password</label>
              <input id="loginPassword" name="password" type="password" autocomplete="current-password"
                placeholder="Enter your password" required minlength="6" />
              <button type="submit" class="btn-product btn-product-secondary checkout-pay-btn">
                <i class="bi bi-envelope-lock"></i>
                Login with Email
              </button>
            </form>

            <p class="auth-switch-copy">
              New here? <a href="signup.html">Create an account</a>
            </p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="hbFooterHost" data-include="partials/footer.html"></div>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/auth-forms.js"></script>
  <script src="assets/js/product-theme.js"></script>
  <script src="assets/js/product-auth-ui.js"></script>
  <script src="assets/js/purchase-state.js"></script>
</body>

</html>
